name: Deploy APEX GT3 to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache fetched CC0 assets & baked HDR skies
        uses: actions/cache@v4
        with:
          path: public/assets
          key: apex-gt3-assets-${{ hashFiles('scripts/fetch-assets.mjs', 'scripts/bake-environments.mjs', 'scripts/build-botanical-kit.mjs') }}

      - name: Fetch keyless CC0 assets & bake HDR environments
        run: npm run fetch:assets

      - name: Build production bundle for GitHub Pages
        env:
          VITE_BASE: ./
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
