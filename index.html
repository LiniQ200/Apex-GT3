<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b1012" />
    <title>APEX GT3 // WEBGPUSIM</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23131417'/%3E%3Cpath d='M5 25 16 6h5l6 19h-6l-1-5h-7l-3 5zm10-10h4l-1-5z' fill='%23ff5329'/%3E%3C/svg%3E"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #scene {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #0b1012;
        color: white;
        font-family: Arial, sans-serif;
      }
      #scene {
        display: block;
        touch-action: none;
        outline: none;
      }
      #ui {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        background: linear-gradient(120deg, #11171a, #090c0d);
        font: 700 12px/2.5 monospace;
        letter-spacing: 0.2em;
      }
      #loading b {
        font: italic 900 46px Arial;
        letter-spacing: -0.06em;
      }
      #loading span {
        color: #ffae58;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" tabindex="0" aria-label="Racing simulator"></canvas>
    <main id="ui"></main>
    <div id="loading" role="status">
      <b>APEX GT3</b><span>VALLE D’ORO • PADDOCK</span><small id="progress">INITIALIZING SIMULATOR</small>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
